name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build package entry points
        run: pnpm exec turbo run build --filter=@diversifi/shared --filter=@stable-station/mento-utils
      - name: Push-selection policy
        run: node --test scripts/pre-push-checks.test.mjs
      - name: Root typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Full unit and component suite
        run: pnpm exec vitest run --maxWorkers=2 --minWorkers=2
