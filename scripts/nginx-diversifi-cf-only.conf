# Lock the DiversiFi API origin down to Cloudflare.
#
# NOT yet enabled. It is activated by uncommenting the include in
# scripts/nginx-diversifi-api.conf (the sites-enabled server block) —
# and only AFTER the Cloudflare DNS record for api.diversifi.famile.xyz is
# proxied (orange cloud) — AND after Cloudflare can actually serve TLS for
# the hostname: api.diversifi.famile.xyz is a SECOND-LEVEL subdomain, which
# the free Universal SSL cert does not cover (it needs Advanced Certificate
# Manager / Total TLS). The 2026-10-26 flip was reverted for exactly that —
# the edge handshake failed and public API traffic broke.
# Enabling it early would also cut off every direct client.
#
# Install:
#   sudo cp scripts/nginx-diversifi-cf-only.conf /etc/nginx/snippets/
#
# Why it matters: without this the origin IP is directly reachable, so a
# forged `cf-ipcountry` header would be trusted by the country gate above.
# Locking the origin to Cloudflare's ranges is what makes that header
# trustworthy. It also hides the origin IP of a box that serves a dozen
# unrelated services.

allow 173.245.48.0/20;
allow 103.21.244.0/22;
allow 103.22.200.0/22;
allow 103.31.4.0/22;
allow 141.101.64.0/18;
allow 108.162.192.0/18;
allow 190.93.240.0/20;
allow 188.114.96.0/20;
allow 197.234.240.0/22;
allow 198.41.128.0/17;
allow 162.158.0.0/15;
allow 104.16.0.0/13;
allow 104.24.0.0/14;
allow 172.64.0.0/13;
allow 131.0.72.0/22;
allow 2400:cb00::/32;
allow 2606:4700::/32;
allow 2803:f800::/32;
allow 2405:b500::/32;
allow 2405:8100::/32;
allow 2a06:98c0::/29;
allow 2c0f:f248::/32;
# On-box callers: api.diversifi.famile.xyz is pinned to 127.0.0.1 in
# /etc/hosts so the Guardian-loop cron and service probes never hairpin
# through the edge. Without this the lockdown would deny them too.
allow 127.0.0.1;
deny all;
