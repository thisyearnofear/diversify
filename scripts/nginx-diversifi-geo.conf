# DiversiFi — sanctioned-location gate for the API origin.
#
# Install (http context — this file is included from nginx.conf, so it must
# NOT live in sites-enabled/, which only holds server blocks):
#   sudo cp scripts/nginx-diversifi-geo.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The page path is gated by apps/web/proxy.ts on Vercel (it reads
# x-vercel-ip-country / x-vercel-ip-country-region). The API origin had NO
# gate at all, so every direct call to api.diversifi.famile.xyz bypassed it.
#
# This closes the country-level half at the origin. The country comes from
# Cloudflare's cf-ipcountry, which only exists once the DNS record is
# proxied through Cloudflare — until then the header is absent and the map
# returns "" (not blocked). The list mirrors SANCTIONED_COUNTRIES in
# packages/shared/src/config/jurisdictions.ts.
#
# Sub-national subdivisions (UA: Crimea, Sevastopol, Donetsk, Luhansk) are
# NOT covered here — Cloudflare's free tier sends a country code only.
# Those stay enforced on the page path, where Vercel supplies the region.
# Do not claim region-level coverage at the API origin.

map $http_cf_ipcountry $diversifi_sanctioned {
    default "";
    CU "1";
    IR "1";
    KP "1";
    SY "1";
}
